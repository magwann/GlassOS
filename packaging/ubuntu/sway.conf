# GlassOS session compositor config for Ubuntu (sway). Install to /etc/glassos/sway.conf
default_border none
xwayland disable
output * bg #0a4f8f solid_color
font pango:Inter 10
# Click-to-focus: with focus_follows_mouse the focused/raised window flickers
# ("shakes") as the cursor crosses window edges. Keep focus stable instead.
focus_follows_mouse no
mouse_warping none
exec /usr/local/bin/glassos-shell

# GlassOS shell is the desktop; real apps float on top with their own (themed) CSD.
for_window [app_id="glassos-shell"] border none
for_window [app_id="^(?!glassos-shell$).*$"] floating enable, border none, resize set 940 620, move position center
