# GlassOS session compositor config for Ubuntu (sway). Install to /etc/glassos/sway.conf
default_border none
xwayland disable
output * bg #0a4f8f solid_color
font pango:Inter 10
exec /usr/local/bin/glassos-shell

for_window [app_id="glassos-shell"] border none
for_window [app_id="^(?!glassos-shell$).*$"] floating enable, resize set 920 600, move position center, border normal 28

#                       border   bg       text     indicator child_border
client.focused          #35e0c4  #2a9db8  #ffffff  #7be495   #35e0c4
client.unfocused        #21384a  #21384a  #cfe8f5  #21384a   #21384a
client.focused_inactive #21384a  #21384a  #cfe8f5  #21384a   #21384a
